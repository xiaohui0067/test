name: Fetch lottery data

on:
  workflow_dispatch:
  schedule:
    # 21:45 Beijing time, GitHub Actions schedules use UTC.
    - cron: "45 13 * * *"

permissions:
  contents: write

concurrency:
  group: fetch-lottery-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        shell: pwsh
        run: |
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and rebuild data
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\fetch-am.ps1 -OutputDir . -SkipSnapshot

      - name: Commit changes
        id: commit
        shell: pwsh
        run: |
          git add assets data pages index.html kjjl.html dashboard.html report.html logs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "No fetched data changes to commit."
            "has_changes=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          git commit -m "chore: update fetched data"
          "has_changes=true" >> $env:GITHUB_OUTPUT

      - name: Push changes
        if: steps.commit.outputs.has_changes == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
