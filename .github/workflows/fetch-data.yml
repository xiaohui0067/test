name: Fetch lottery data

on:
  workflow_dispatch:
  schedule:
    # 21:45 Beijing time, GitHub Actions schedules use UTC.
    - cron: "45 13 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and rebuild data
        shell: pwsh
        run: .\fetch-am.ps1 -OutputDir . -SkipSnapshot

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data pages index.html dashboard.html report.html logs
          $changes = git status --porcelain
          if (-not $changes) {
            "No fetched data changes to commit."
            exit 0
          }
          git commit -m "chore: update fetched data"
          git push
